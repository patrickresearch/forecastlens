[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecastlens"
version = "0.1.0"
description = "Diagnostic layer for time-series forecasts: regime-aware calibration, leak-safe backtesting, and economic decision-value evaluation on top of darts/neuralforecast outputs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Patrick Petter" }]
keywords = ["forecasting", "time-series", "backtesting", "evaluation", "darts", "neuralforecast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
darts = ["darts>=0.27"]
neuralforecast = ["neuralforecast>=1.6"]
viz = ["matplotlib>=3.7"]
all = ["forecastlens[darts,neuralforecast,viz]"]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "properscoring>=0.1",
    "sktime>=0.24",
]
dev = [
    "forecastlens[test]",
    "ruff>=0.4",
    "mypy>=1.8",
    "pandas-stubs",
    "pre-commit>=3.6",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/patrickresearch/forecastlens"
Repository = "https://github.com/patrickresearch/forecastlens"
Changelog = "https://github.com/patrickresearch/forecastlens/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/forecastlens"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["forecastlens"]

[[tool.mypy.overrides]]
# Optional extras: not installed in the lint job, and untyped even when they are.
module = ["darts.*", "neuralforecast.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=forecastlens --cov-report=term-missing"
